services:
  db:
    image: mysql:8.0
    container_name: db_smart_garage
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    command: --innodb-buffer-pool-size=64M --max_connections=50
    ports:
      - "3306:3306"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p'${DB_PASS}' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ./smart-garage-api
      dockerfile: Dockerfile
    container_name: api_smart_garage
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: 3306
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${GOOGLE_SERVICE_ACCOUNT_KEY:-}
      BACKUP_AUTO_HOURS: ${BACKUP_AUTO_HOURS:-}
    ports:
      - "3000:3000"
    volumes:
      - ./smart-garage-api/uploads:/app/uploads
      - ./smart-garage-api/backups:/app/backups
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ui:
    build:
      context: ./smart-garage-ui
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
        - VITE_NOME_EMPRESA=${VITE_NOME_EMPRESA:-Rodrigo Veículos}
    container_name: ui_smart_garage
    ports:
      - "5173:80"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - api

volumes:
  mysql_data:
